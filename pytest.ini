[pytest]
testpaths = tests
pythonpath = .
filterwarnings =
    ignore::DeprecationWarning

[coverage:run]
branch = true
source = .
omit =
    */tests/*
    */alembic/*
    */.venv/*
    */venv/*
    */scripts/debug_deploy_probe.py
    */scripts/export_openapi.py

[coverage:report]
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:
