name: Deploy

# Dev: após CI verde em main. Prod: tag v* (com smoke pytest no job).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  push:
    tags: ["v*"]

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

env:
  RAILWAY_PROJECT_ID: e21dd1a9-d1c7-40f4-ad4b-ec18b067c0ed

jobs:
  deploy-dev:
    name: Deploy Dev (Railway API + Vercel Preview)
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy API to Railway Dev
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up \
            --project "$RAILWAY_PROJECT_ID" \
            --environment production \
            --service api \
            --ci \
            -m "CI deploy Dev ${{ github.event.workflow_run.head_sha }}"

      - name: Install Vercel CLI
        run: npm i -g vercel

      - name: Deploy frontend Preview
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --token="$VERCEL_TOKEN" --yes

  deploy-prod:
    name: Deploy Prod (Railway API + Vercel Production)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy API to Railway Prod
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up \
            --project "$RAILWAY_PROJECT_ID" \
            --environment prod \
            --service api-prod \
            --ci \
            -m "CI deploy Prod ${{ github.ref_name }} (${{ github.sha }})"

      - name: Install Vercel CLI
        run: npm i -g vercel

      - name: Deploy frontend Production
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel deploy --prod --token="$VERCEL_TOKEN" --yes
